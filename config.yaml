# =============================================================================
#  Drones project - single configuration file
#  Every tunable value used by the controller, simulators, tools and tests
#  lives here.  Code reads it through quadrotor_controller/config.py
#  (cfg("section.key")).  Override the file with  --config other.yaml  or the
#  environment variable DRONES_CONFIG.
#
#  Syntax: nested "key: value" maps, inline lists [a, b], # comments.
#  Units: SI (m, s, kg, N, rad) unless noted.
# =============================================================================

paths:                                  # relative to the project folder
  target_file: target.txt               # written by set_target.py, read by every runner
  results_dir: results
  mujoco_model: models/quadrotor.xml    # drone + sensors; includes the generated city
  city_mujoco: models/city.xml          # generated by generate_world.py (do not edit by hand)
  gazebo_world: models/quadrotor.world  # generated by generate_world.py
  gazebo_drone_template: models/gazebo_quadrotor.sdf
  gazebo_plugin_dir: gazebo_plugin
  gym_pybullet_drones: gym_pybullet_drones_repo   # used if gym-pybullet-drones is not pip-installed

# --- Vehicle used by MuJoCo, Gazebo/Python flight core, web bridge, MAVLink -------
vehicle:
  mass: 1.5
  inertia: [0.03, 0.03, 0.05]           # diag(Jxx, Jyy, Jzz) kg m^2
  gravity: 9.81
  drag: 0.0                             # linear drag f(v) = -drag * v  [1/s] (paper eq. 26)
  thrust_min_ratio: 0.15                # T_min = ratio * m g
  thrust_max_ratio: 2.5                 # T_max = ratio * m g

# --- De Monte & Lohmann (2013) controller: gains of the paper, Sec. IV ----------
#     stored as positive numbers k = -A
controller:
  k_x: 1.0                              # A_x = -1
  k_v: 3.0                              # A_v = -3
  k_t: 8.0                              # A_t = -8
  k_r: 12.0                             # A_r = -12
  k_phi: 2.0                            # a_phi = -2
  k_wz: 12.0                            # a_wz = -12
  min_normalised_thrust: 0.001          # guard for D(T)^-1 (T must stay > 0)
  heading_derivative_step: 0.00001      # step of the directional derivative of l' R_s

# --- Earlier simplified 2-step law (kept as a baseline for comparison) -----------
baseline_controller:
  k_position: 2.0
  k_velocity: 1.5
  k_tilt: 3.5
  k_yaw: 2.5
  k_rate: 0.8
  max_horizontal_acceleration: 5.0
  max_thrust_ratio: 2.5
  min_thrust: 0.000001

# --- Sensors and state estimation ------------------------------------------------
noise:
  enabled: true
  pos_std: 0.05                         # GPS / motion capture position
  vel_std: 0.08                         # velocity
  rate_std: 0.02                        # gyroscope
  seed: null                            # null = random

estimator:
  enabled: true
  process_noise_acc: 0.3                # Kalman filter Q (acceleration noise std)
  rate_filter_alpha: 0.2                # gyro low-pass factor
  dt_change_tolerance: 0.000001         # rebuild F, B, Q when dt changes more than this

# --- Reference trajectories --------------------------------------------------------
trajectory:
  hover_point: [0.0, 0.0, 1.0]
  helix:                                # paper Fig. 4
    amp_x: 1.0
    amp_y: 2.0                          # y lags x by a quarter period
    amp_z: 0.5
    period_xy: 6.25
    period_z: 12.5
    yaw_amp: 1.0
  figure8:                              # project extension
    amp_x: 2.0
    amp_y: 1.0
    amp_z: 0.3
    period: 12.0
    yaw_amp: 0.3
    height_offset: 0.2                  # centre height above the hover point
  mission:                              # takeoff -> hover -> helix -> figure-8 (looping)
    takeoff_time: 5.0
    hover_time: 2.0
    transfer_time: 3.0
    speed_ramp_time: 3.0                # smooth speed ramp in/out of each manoeuvre
    helix_periods: 4                    # horizontal periods per pass
    figure8_periods: 2
  scale: 1.0                            # horizontal scale of helix / figure-8
  transfer_min_time: 3.0                # mode switch: move to the start point ...
  transfer_time_per_metre: 2.0          # ... in max(min_time, per_metre * distance)
  zero_weight_tolerance: 0.000000000001

reference_model:                        # set points -> C^4 reference (paper Fig. 3)
  position_order: 5                     # (tau s + 1)^-5  -> x_T in C^4
  yaw_order: 3                          # (tau s + 1)^-3  -> phi_T in C^2
  tau_min: 0.35
  v_max: 1.5                            # peak reference speed for large steps
  yaw_tau: 0.4

# --- Guidance (target.txt commands, mode switching, avoidance offsets) ------------
guidance:
  poll_period: 0.25                     # how often target.txt is read
  min_z: 0.15                           # lowest reference height (except landing)
  land_point: [0.0, 0.0, 0.15]
  setpoint_speed: 1.5
  avoid_gain: 1.0
  max_offset: 1.5                       # largest avoidance offset on trajectories
  offset_tau: 0.15                      # smoothing of the avoidance offset
  offset_decay_time: 2.0                # offset returns to zero when the path is clear
  carrot_tau: 0.2                       # set-point flights with avoidance
  carrot_leash: 0.8
  carrot_approach_gain: 0.8             # carrot slows down as speed = gain * distance

# --- Global path planner for set points (all simulators) ---------------------------
planner:
  enabled: true
  resolution: 0.5                       # grid cell (m)
  clearance: 1.3                        # horizontal distance kept from obstacles (m)
  vertical_clearance: 1.2               # distance kept above / below obstacles (m)
  ignore_below: 0.3                     # lower obstacles (roads, kerbs, plaza) are not planned around
  margin: 8.0                           # grid extends this far beyond the city (m)
  column_radius: 0.6                    # free radius needed for vertical climb / descent (m)
  waypoint_radius: 0.6                  # carrot aims at the next curve point beyond this distance (m)
  inside_goal: nearest                  # target inside a building: nearest (free point) | above (roof)
  los_step: 0.25                        # line-of-sight sampling for path shortening (m)
  corner_radius: 10.0                   # route corners are rounded with up to this radius (m) -> smooth curve
  radius_scales: [1.0, 0.5, 0.25, 0.0]  # tried in turn until the curve stays clear of obstacles
  curve_clearance: 1.0                  # clearance the rounded curve must keep (m)
  sample_step: 0.3                      # spacing of the curve points followed by the carrot (m)

# --- LiDAR obstacle avoidance (defaults; simulators override some) -----------------
avoidance:
  safety_distance: 1.0
  detection_distance: 2.2
  max_repulsive_speed: 2.2
  ignore_behind: false
  behind_cosine: 0.2                    # obstacles with cos(angle to motion) below this are ignored
  min_speed_for_direction: 0.05
  clear_reset_steps: 100                # steps clear before the passing side may change
  safety_clamp_factor: 0.5              # distances below factor*safety are treated as factor*safety
  max_strength: 2.5
  strength_exponent: 1.5
  circulation_weight: 0.8
  min_goal_weight: 0.15
  ground_clearance: 0.35                # push up when the down ray is shorter
  ground_push: 1.0
  vertical_push_gain: 0.5
  max_safe_speed: 3.5
  min_repulsion: 0.0001
  lidar_range: 8.0
  lidar_beams: 8                        # horizontal beams, evenly spaced

# --- Logging / console ----------------------------------------------------------
logging:
  banner_width: 72
  print_period: 0.5                     # console telemetry period [s]
  csv_period: 0.01                      # CSV log period [s]
  realtime_min_sleep: 0.0005

# --- MuJoCo --------------------------------------------------------------------------
mujoco:
  lidar_range: 8.0
  lidar_geom_groups: [1, 1, 0, 1, 1, 1] # group 2 (target marker) is not seen by the LiDAR
  avoidance:
    safety_distance: 1.0                # 1.5 kg drone, rotor tips ~0.45 m from the centre
    detection_distance: 2.0
    max_repulsive_speed: 1.2
    ignore_behind: true
  avoid_gain: 3.0
  setpoint_speed: 1.0
  windows_gl: wgl                       # MUJOCO_GL on Windows (hardware OpenGL)
  windows_gl_dlls: [opengl32.dll, glu32.dll]   # loaded from %SystemRoot%\System32
  camera: {distance: 9.0, azimuth: 140.0, elevation: -24.0, lookat: [0.0, 0.0, 1.0]}
  track_drone: false                    # true: camera follows the drone (also: double-click the drone + Ctrl)
  show_side_panels: false               # MuJoCo viewer panels (toggle with Tab / Shift+Tab)
  overlay_period: 0.05
  trail: {enabled: true, segments: 400, period: 0.05, rgba: [1.0, 0.45, 0.0, 0.9], width: 0.012}
  hide_rangefinder_rays: true

# --- PyBullet / gym-pybullet-drones -------------------------------------------------
pybullet:
  drone_model: CF2X
  physics: PYB
  start: [0.0, 0.0, 0.08]
  physics_hz: 1000
  control_hz: 500
  thrust_min_ratio: 0.15                # of m g
  thrust_max_fraction: 0.9              # of 4 k_f RPM_max^2
  disable_default_damping: true         # PyBullet's numerical damping is not physical drag
  lidar_range: 6.0
  lidar_ray_start: 0.08                 # rays start this far from the centre (outside the hull)
  avoidance:
    safety_distance: 0.6
    detection_distance: 1.5
    max_repulsive_speed: 1.2
    ignore_behind: true
  avoid_gain: 3.0
  setpoint_speed: 1.0
  world_from_mujoco_model: true         # build the city from paths.mujoco_model
  gui:
    window_size: [1280, 720]            # PyBullet window (width, height) - a normal window, not full screen
    hide_side_panels: true              # full-screen 3D view (PyBullet debug panels off)
    shadows: true
    light_direction: [0.45, 0.3, 1.0]   # towards the light (PyBullet convention)
    shadow_map_resolution: 8192
    shadow_map_world_size: 60
    disable_mouse_picking: true         # left-drag does not grab bodies
    remove_drone_axes: true             # gym-pybullet-drones draws RGB axes on the drone
  camera:
    start_mode: follow                  # follow | overview | top
    update_period: 0.02
    follow: {distance: 1.1, yaw: 45.0, pitch: -18.0}
    overview: {distance: 14.0, yaw: 45.0, pitch: -32.0, target: [0.0, 0.0, 1.0]}
    top: {distance: 30.0, yaw: 0.0, pitch: -89.0, target: [0.0, 0.0, 0.0]}
    rotate_step_deg: 3.0                # per key press / repeat
    pitch_limits: [-89.0, -1.0]
    zoom_factor: 1.08
    min_distance: 0.3
    max_distance: 120.0
  keys:                                 # PyBullet window keyboard controls
    follow: "1"
    overview: "2"
    top: "3"
    trail: "4"
    zoom_in: "="
    zoom_out: "-"
    rotate_left: LEFT
    rotate_right: RIGHT
    pitch_up: UP
    pitch_down: DOWN
  trail: {enabled: true, segments: 400, period: 0.05, rgb: [1.0, 0.45, 0.0], width: 2.5}
  ground_material: grass                # world.materials entry used to colour the PyBullet ground plane
  marker: {radius: 0.03, rgba: [1.0, 0.2, 0.3, 0.45]}
  hud: {anchor: [0.02, 0.05], line_spacing: 0.045, depth: 0.5, rgb: [0.05, 0.05, 0.1], size: 1.0, period: 0.1}   # text in the top-left corner (window fractions)

# --- Python flight core used by Gazebo and the web bridge ---------------------------
python_sim:
  physics_dt: 0.002
  start: [0.0, 0.0, 0.2]
  ground_z: 0.2
  frame_dt: 0.02                        # one frame = several physics steps
  avoid: true                           # LiDAR (ray cast on the city map) + path planner
  lidar_range: 8.0
  lidar_period: 0.02                    # LiDAR scan every 20 ms (reused in between)
  avoidance:
    safety_distance: 1.0
    detection_distance: 2.0
    max_repulsive_speed: 1.2
    ignore_behind: true
  avoid_gain: 3.0
  setpoint_speed: 1.5

gazebo:
  pose_period: 0.1                      # gz model calls (one process each)
  marker_update_distance: 0.3           # gz_model mode: move the target marker when the goal moved this far
  udp_host: auto                        # auto: 127.0.0.1 inside WSL, the WSL IP when sending from Windows
  udp_port: 9090                        # drone pose  (x y z roll pitch yaw, float32)
  target_udp_port: 9091                 # reference / target marker pose
  pose_transport: plugin                # plugin (smooth, needs build_gazebo_plugin.sh once) | gz_model
  plugin_library: libudp_pose_plugin.so
  camera_pose: [-9.0, -9.0, 6.0, 0.0, 0.35, 0.785]   # initial GUI camera x y z roll pitch yaw
  udp_buffer: 1024
  receiver_poll: 0.005
  wsl_distro: Ubuntu
  wsl_user: root
  display: auto                         # auto = WSLg (':0', Windows 11) if present, else VcXsrv on the Windows host
  launch_script: .gazebo_launch.sh      # generated by launch_gazebo_wsl.py, run inside WSL
  wsl_project_dir: auto                 # auto = convert this folder with wslpath
  pixi_env: /root/.pixi/envs/gazebo
  master_uri: http://127.0.0.1:11345
  gazebo_ip: 127.0.0.1
  extra_ld_library_path: /usr/lib/x86_64-linux-gnu
  vcxsrv_exe: C:\Program Files\VcXsrv\vcxsrv.exe
  vcxsrv_args: [":0", "-multiwindow", "-clipboard", "-wgl", "-ac"]
  vcxsrv_start_wait: 2.0
  cleanup_wait: 1.0
  launch_wait: 2.0
  software_rendering: true

bridge:
  host: 127.0.0.1
  http_port: 8080
  ws_port: 8081
  frame_dt: 0.02
  broadcast_period: 0.04
  dashboard: gazebo_visualizer.html
  reconnect_ms: 2000                    # dashboard WebSocket reconnect delay

# --- Web 3D dashboard (run_web_dashboard.py + drone_dashboard.html) ------------------
web:
  host: 127.0.0.1                       # backend on Windows
  wsl_host: 0.0.0.0                     # backend inside WSL (reachable from the Windows browser)
  port: 8090
  page: drone_dashboard.html
  vendor_dir: web_vendor                # three.js r128 (bundled, works offline)
  frame_dt: 0.02                        # flight core frame (several 500 Hz physics steps)
  export_period: 1.0                    # one exported row per simulated second
  poll_ms: 50                           # browser telemetry polling
  chart_period_ms: 200                  # chart redraw
  history_s: 60                         # chart window (s)
  trail_points: 3000                    # 3D flight trail length (samples)
  pick_altitude: 3.0                    # default flight height for targets clicked on the ground (m)
  roof_clearance: 2.0                   # targets clicked on a roof are this far above it (m)
  gap_probe_step: 0.5                   # route check: sampling along the route (m)
  gap_probe_range: 12.0                 # route check: obstacles left AND right within this -> 'between buildings'
  estimate_speed: 0.8                   # route check: average speed for the flight-time estimate (m/s)
  open_browser_wait: 3.0
  wsl_start_wait: 6.0                   # extra wait for the backend inside WSL before opening the browser

# --- ArduPilot / MAVLink -------------------------------------------------------------
mavlink:
  connection: udpin:127.0.0.1:14550     # default for --connect (Mission Planner / sim_vehicle.py --out)
  launch: none                          # none | dronekit | command  (how run_ardupilot_sitl.py starts SITL)
  launch_command: [sim_vehicle.py, -v, ArduCopter, --no-mavproxy]   # used with launch: command
  connect_timeout: 15.0
  startup_wait: 0.5
  stream_rate_hz: 50                    # ATTITUDE / LOCAL_POSITION_NED rate requested from the autopilot
  hover_throttle: auto                  # auto = read MOT_THST_HOVER from the autopilot
  hover_throttle_fallback: 0.5
  hover_throttle_param: MOT_THST_HOVER
  stream_messages: [ATTITUDE, LOCAL_POSITION_NED]
  poll_period: 0.1                      # s, blocking receive slice while waiting for an answer
  resend_period: 1.0                    # s, repeat mode / arm requests until confirmed
  gcs_heartbeat_period: 1.0
  param_retries: 3
  param_tolerance: 0.001
  params: {GUID_OPTIONS: 8}             # bit 3: SET_ATTITUDE_TARGET thrust is thrust, not climb rate
  param_timeout: 3.0
  position_timeout: 30.0                # wait for the EKF position estimate
  mode_timeout: 5.0
  arm_timeout: 10.0
  force_arm: false                      # skip pre-arm checks (SITL only!)
  land_after: true
  land_timeout: 30.0
  control_dt: 0.02
  guided_mode: GUIDED
  land_mode: LAND
  target: [1.0, 1.0, 2.0]
  duration: 20.0

mock_vehicle:
  out: udpout:127.0.0.1:14550
  physics_dt: 0.002
  publish_period: 0.02
  rate_gain: 25.0                       # P gain of the stand-in rate loop
  start: [0.0, 0.0, 0.2]
  ground_z: 0.2
  params: {MOT_THST_HOVER: 0.35, GUID_OPTIONS: 0, ARMING_CHECK: 1}
  modes: {STABILIZE: 0, GUIDED: 4, LAND: 9}
  initial_mode: STABILIZE
  ekf_ready_after: 2.0                  # s before LOCAL_POSITION_NED is published (EKF start-up)
  land_descent_rate: 0.5                # m/s in LAND mode
  disarm_height: 0.05                   # disarm after touchdown (m above ground_z)
  heartbeat_period: 1.0                 # ArduPilot sends HEARTBEAT at 1 Hz
  armable_modes: [STABILIZE, GUIDED]
  land_level_gain: 4.0                  # LAND mode: attitude -> rate gain (1/s)
  land_velocity_gain: 3.0               # LAND mode: climb-rate error -> acceleration gain (1/s)
  realtime_min_sleep: 0.001

# --- Paper experiments (track_error.py) ---------------------------------------------
experiments:
  dt: 0.002
  record_every: 10
  seed: 7
  chatter_start: 1.0                    # ignore the first second for the chatter metric
  fig3:
    start: [0.0, 0.0, 1.0]
    commands: [[1.0, 1.0, 1.5, 1.0], [-1.0, 1.0, 0.5, -1.0], [-1.0, -1.0, 1.5, 1.0], [1.0, -1.0, 0.5, -1.0]]
    repeats: 3
    period: 10.0
    tau_min: 0.3
    yaw_tau: 0.3
    v_max: 10.0
  fig4:
    center: [0.0, 0.0, 1.0]
    duration: 50.0
    skip_periods: 1                     # metrics after the first horizontal period
  mission:
    start: [0.0, 0.0, 0.2]
    duration: 70.0
  divergence_limit: 1000.0              # stop a run when |position| exceeds this (m)
  plots:
    dpi: 130
    figsize_tracking: [9, 9]
    figsize_noise: [9, 7]
    grid_alpha: 0.3
    colors: {reference: "#888888", actual: "#1f6fb2"}
    torque_window: [20.0, 25.0]
  paper_reference:                      # reported in the paper (AscTec Hummingbird, Vicon), Sec. IV
    helix_max_speed: 1.4
    helix_max_tilt_deg: 18
    setpoint_max_speed: 2.2
    setpoint_max_tilt_deg: 22

# --- Numerical tolerances ------------------------------------------------------------
numerics:
  degenerate_tolerance: 0.000000000001  # e.g. q_p ~ 0 (upside down) in the attitude decomposition
  min_shape_half_size: 0.001            # flat MuJoCo geoms get at least this half-thickness in PyBullet

# =============================================================================
#  WORLD (city) - generate_world.py builds models/city.xml (MuJoCo, also used by
#  PyBullet) and models/quadrotor.world (Gazebo) from this section.
#  The flight area (|x|,|y| <= 2.2 m) and the three plaza obstacles used by the
#  avoidance tests are kept unchanged.
# =============================================================================
world:
  seed: 7
  extent: 36.0                          # city half-size (m); ground plane is larger
  ground_size: 150.0
  floor_height: 3.0
  plaza:
    half_size: 6.5                      # paved square around the helipad
    top: 0.02
    helipad_radius: 2.5
    benches_at: 5.6                     # bench / planter ring (keep > 4.5 m from the flight area)
  roads:
    ring_outer: 13.5                    # ring road between plaza and city blocks
    avenue_half_width: 3.5              # avenues along the x and y axes
    top: 0.01
    line_width: 0.12
    dash_length: 2.0
    dash_gap: 2.0
    crosswalk_stripe: 0.5
    crosswalk_length: 3.0
  sidewalk:
    width: 2.0
    curb_height: 0.12
  blocks:
    lot_pitch: 10.0                     # lot centres at k * lot_pitch (k = 1 .. lots_per_axis)
    lots_per_axis: 3
    lot_half_size: 4.0
    footprint_fraction: [0.6, 0.92]
    floors: [2, 7]
    tall_floors: [9, 15]                # towers on lots farthest from the centre
    tall_probability: 0.35
    shopfront_floor: true
    rooftop_units: [1, 3]
    antenna_min_floors: 9
  street:
    tree_spacing: 9.0
    lamp_spacing: 13.5
    tree_trunk: [0.12, 1.5]             # radius, height
    tree_canopy: [1.1, 0.8]             # lower / upper canopy radius
    lamp_height: 4.5
    cars: 14
    car_size: [2.2, 0.9, 0.55]          # half length, half width, body half height
    traffic_lights: true
  plaza_obstacles:                      # avoidance demo obstacles (positions/sizes used by tests)
    clock_tower: {pos: [3.2, 3.2], half: [0.6, 0.6, 1.6]}
    cafe_pavilion: {pos: [-4.2, 0.6], half: [0.55, 0.7, 1.4]}
    metro_entrance: {pos: [0.6, -4.2], half: [0.7, 0.55, 1.5]}
    lamps: [[4.0, -1.6], [-4.0, -1.8]]
  materials:                            # rgba (+ optional specular / shininess / reflectance)
    grass: {rgba: [0.27, 0.45, 0.2, 1], texture: noise, rgb2: [0.22, 0.38, 0.16]}
    asphalt: {rgba: [0.3, 0.3, 0.32, 1], texture: noise, rgb2: [0.25, 0.25, 0.27]}
    paving: {rgba: [0.72, 0.7, 0.66, 1], texture: noise, rgb2: [0.66, 0.64, 0.6]}
    sidewalk: {rgba: [0.62, 0.62, 0.64, 1]}
    curb: {rgba: [0.78, 0.78, 0.8, 1]}
    line_white: {rgba: [0.95, 0.95, 0.95, 1]}
    line_yellow: {rgba: [0.96, 0.78, 0.1, 1]}
    helipad_dark: {rgba: [0.18, 0.2, 0.22, 1]}
    helipad_yellow: {rgba: [0.96, 0.78, 0.1, 1]}
    concrete: {rgba: [0.72, 0.71, 0.68, 1]}
    beige: {rgba: [0.82, 0.74, 0.6, 1]}
    brick: {rgba: [0.62, 0.32, 0.24, 1]}
    sandstone: {rgba: [0.86, 0.8, 0.66, 1]}
    glass: {rgba: [0.2, 0.36, 0.5, 1], specular: 0.9, shininess: 0.9, reflectance: 0.25}
    glass_dark: {rgba: [0.12, 0.17, 0.24, 1], specular: 0.9, shininess: 0.9, reflectance: 0.3}
    glass_light: {rgba: [0.55, 0.72, 0.82, 1], specular: 0.9, shininess: 0.9, reflectance: 0.2}
    roof: {rgba: [0.35, 0.35, 0.37, 1]}
    metal: {rgba: [0.6, 0.62, 0.65, 1], specular: 0.6, shininess: 0.6}
    dark_metal: {rgba: [0.18, 0.2, 0.22, 1], specular: 0.5}
    beacon: {rgba: [1.0, 0.1, 0.05, 1]}
    bark: {rgba: [0.36, 0.25, 0.15, 1]}
    leaves: {rgba: [0.2, 0.48, 0.18, 1]}
    leaves_dark: {rgba: [0.14, 0.38, 0.14, 1]}
    lamp_light: {rgba: [1.0, 0.95, 0.75, 1]}
    wood: {rgba: [0.55, 0.38, 0.22, 1]}
    soil: {rgba: [0.3, 0.22, 0.15, 1]}
    clock_face: {rgba: [0.95, 0.95, 0.9, 1]}
    awning: {rgba: [0.75, 0.18, 0.15, 1]}
    tyre: {rgba: [0.08, 0.08, 0.08, 1]}
